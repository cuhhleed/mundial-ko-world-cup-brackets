[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "^0.136.3"
uvicorn = {version = "^0.49.0", extras = ["standard"]}
boto3 = "^1.43.29"
pydantic-settings = "^2.14.1"
structlog = "^26.1.0"
pyjwt = {extras = ["crypto"], version = "^2.13.0"}
redis = {version = "^5.3", extras = ["hiredis"]}
httpx = "^0.28.1"


[project]
name = "mundial-ko-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.17,<0.16.0)",
    "moto[dynamodb] (>=5.2.2,<6.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
